[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoharness"
version = "0.1.0"
description = "A coding agent harness built from scratch, stdlib only."
requires-python = ">=3.11"
dependencies = []          # stage 1 is deliberately dependency-free

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nanoharness = "nanoharness.cli:main"

[tool.setuptools]
packages = ["nanoharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so tests can import evals/
